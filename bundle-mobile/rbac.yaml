removeStrategy:
  rbac: sync

roles:
  - name: "controller-admin"
    permissions:
      - "Overall/Administer"
  - name: "mobile-developer"
    permissions:
      - "Job/Build"
      - "Job/Read"
      - "Job/Configure"
      - "Job/Workspace"
  - name: "mobile-viewer"
    permissions:
      - "Job/Read"

groups:
  - name: "controller-admins"
    members:
      users:
        - "admin"
    roles:
      - name: "controller-admin"
        grantedAt: current

# Demo talking point: mobile uses a simpler two-tier model (developer +
# viewer) vs payments' three-tier model - each team gets exactly the
# granularity it needs.
