# Allow CasC to create/update items cleanly
removeStrategy:
  rbac: SYNC
  items: NONE

items:
  - kind: "folder"
    name: "mobile"
    displayName: "Mobile Team"
    description: "Mobile app build, test, and release pipelines."
    groups:
      - name: "Mobile Developers"
        members:
          external_groups:
            - "mobile-developers"
        roles:
          - name: "mobile-developer"
      - name: "Mobile Viewers"
        members:
          external_groups:
            - "mobile-viewers"
        roles:
          - name: "mobile-viewer"
    items:
      - kind: "pipeline"
        name: "mobile-app-build"
        displayName: "Mobile App - Build & Unit Test"
        definition:
          cpsFlowDefinition:
            script: |
              pipeline {
                agent { label 'mobile' }
                stages {
                  stage('Build') { steps { echo 'gradle assembleDebug...' } }
                  stage('Test')  { steps { echo 'gradle testDebugUnitTest...' } }
                }
              }
            sandbox: true
