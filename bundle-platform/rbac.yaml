roles:
  global:
    - name: "controller-admin"
      description: "Full administrative rights on this controller"
      permissions:
        - "Overall/Administer"
      entries:
        - group: "platform-controller-admins"

    - name: "authenticated-baseline"
      description: "Minimum baseline so any authenticated user can see the controller exists"
      permissions:
        - "Overall/Read"
      entries:
        - group: "authenticated"

  items:
    - name: "platform-folder-sre"
      description: "SRE/on-call: full job control including credentials, since they manage shared infra secrets"
      pattern: "platform/.*"
      permissions:
        - "Job/Build"
        - "Job/Read"
        - "Job/Configure"
        - "Job/Cancel"
        - "Job/Workspace"
        - "Credentials/View"
        - "Credentials/Update"
      entries:
        - group: "platform-sre"

    - name: "platform-folder-engineer"
      description: "Platform engineer: build and read, cannot touch credentials"
      pattern: "platform/.*"
      permissions:
        - "Job/Build"
        - "Job/Read"
        - "Job/Workspace"
      entries:
        - group: "platform-engineers"

    - name: "platform-folder-viewer"
      description: "Read-only visibility for other teams depending on shared infra status"
      pattern: "platform/.*"
      permissions:
        - "Job/Read"
      entries:
        - group: "platform-viewers"

# Demo talking point: platform team gets a broader "SRE" role with
# credential-update rights (they manage shared secrets), while payments
# intentionally does NOT grant credential updates to any non-admin role.
# This contrast is a good live example of RBAC being tailored per team
# instead of one blanket policy.
