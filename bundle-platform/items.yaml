# Allow CasC to create/update items cleanly
removeStrategy:
  rbac: SYNC
  items: NONE

items:
  - kind: "folder"
    name: "platform"
    displayName: "Platform / Infra Team"
    description: "Shared infrastructure pipelines - Terraform plans, cluster upgrades, shared library maintenance."
    groups:
      - name: "Platform SRE"
        members:
          external_groups:
            - "platform-sre"
        roles:
          - name: "platform-sre"
      - name: "Platform Engineers"
        members:
          external_groups:
            - "platform-engineers"
        roles:
          - name: "platform-engineer"
      - name: "Platform Viewers"
        members:
          external_groups:
            - "platform-viewers"
        roles:
          - name: "platform-viewer"
    items:
      - kind: "pipeline"
        name: "infra-terraform-plan"
        displayName: "Infra - Terraform Plan"
        definition:
          cpsFlowDefinition:
            script: |
              pipeline {
                agent any
                stages {
                  stage('Init') { steps { echo 'terraform init...' } }
                  stage('Plan') { steps { echo 'terraform plan...' } }
                }
              }
            sandbox: true
