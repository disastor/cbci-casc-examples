removeStrategy:
  rbac: sync

roles:
  - name: "controller-admin"
    permissions:
      - "hudson.model.Hudson.Administer"
  - name: "payments-lead"
    permissions:
      - "hudson.model.Hudson.Read"
      - "hudson.model.Item.Read"
      - "hudson.model.Item.Build"
      - "hudson.model.Item.Configure"
      - "hudson.model.Item.Cancel"
      - "hudson.model.Item.Workspace"
      - "com.cloudbees.plugins.credentials.CredentialsProvider.View"
    filterable: "true"
  - name: "payments-developer"
    permissions:
      - "hudson.model.Hudson.Read"
      - "hudson.model.Item.Read"
      - "hudson.model.Item.Build"
      - "hudson.model.Item.Workspace"
    filterable: "true"
  - name: "payments-viewer"
    permissions:
      - "hudson.model.Hudson.Read"
      - "hudson.model.Item.Read"
    filterable: "true"

groups:
  - name: "controller-admins"
    members:
      users:
        - "admin"
        - "disastor"
        - "dastor"
    roles:
      - name: "controller-admin"
        grantedAt: current

# Demo talking point: three roles instead of "admin or nothing." Map
# payments-leads / payments-developers / payments-viewers to real AD/SAML
# groups in production instead of local Jenkins groups.
#
# NOTE: Permission IDs must be the fully-qualified CloudBees RBAC form
# (e.g. hudson.model.Item.Build), not shorthand like "Job/Build" - the
# shorthand form is not recognized by the CloudBees RBAC plugin's
# permission engine and will fail runtime validation.
